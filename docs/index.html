<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程控制平台 - 你的局域网通信与管理助手</title>
    
    <!-- 网页图标 -->
    <link rel="icon" href="/remote-control-platform/send.ico">
    <link rel="alternate icon" href="/remote-control-platform/favicon.ico">
    
    <!-- 主题脚本 -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    
    <style>
        /* ===== 主题变量 - 完全重构 ===== */
        /* 暗色主题（默认） */
        [data-theme="dark"] {
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --bg-card-hover: #1c2333;
            --bg-input: #0d1117;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --border-color: #30363d;
            --border-hover: #58a6ff;
            --shadow: 0 8px 32px rgba(0,0,0,0.5);
            --accent: #58a6ff;
            --success: #3fb950;
            --warning: #d29922;
        }
        
        /* 亮色主题 - 彻底明亮 */
        [data-theme="light"] {
            --bg-body: #f6f8fa;
            --bg-card: #ffffff;
            --bg-card-hover: #f3f4f6;
            --bg-input: #ffffff;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-muted: #8b949e;
            --border-color: #d0d7de;
            --border-hover: #0969da;
            --shadow: 0 8px 32px rgba(0,0,0,0.08);
            --accent: #0969da;
            --success: #2da44e;
            --warning: #9a6700;
        }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ===== 容器 ===== */
        .container {
            max-width: 1200px;
            width: 100%;
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left .logo {
            font-size: 28px;
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .header-left h1 span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 16px;
            margin-left: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* ===== 版本号 ===== */
        .version-badge {
            background: var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }

        /* ===== 主题切换按钮 ===== */
        .theme-toggle {
            background: var(--border-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: scale(1.05);
        }

        /* ===== 状态指示器 ===== */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--border-color);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        /* ===== 网格布局 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        /* ===== 卡片 ===== */
        .card {
            background: var(--bg-body);
            padding: 24px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
            cursor: default;
        }

        .card:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .card .icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }

        .card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .card p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .card .badge {
            display: inline-block;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--border-color);
            padding: 4px 12px;
            border-radius: 40px;
            transition: all 0.3s ease;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--text-primary);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .header-left h1 {
                font-size: 20px;
            }
            .header-left h1 span {
                display: block;
                margin-left: 0;
                font-size: 14px;
                margin-top: 4px;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .header-right {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🖥️</span>
                <h1>远程控制平台 <span>局域网通信与管理助手</span></h1>
            </div>
            <div class="header-right">
                <div class="version-badge">版本 3.2.0</div>
                <div class="status-badge">
                    <span class="dot"></span>
                    在线
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                    🌙
                </button>
            </div>
        </header>

        <!-- 功能卡片 -->
        <div class="grid">
            <div class="card">
                <span class="icon">📡</span>
                <h3>设备发现</h3>
                <p>自动扫描局域网内所有在线设备，快速建立连接。</p>
                <span class="badge">实时扫描</span>
            </div>
            <div class="card">
                <span class="icon">🔒</span>
                <h3>安全通信</h3>
                <p>端到端加密传输，保障你的数据隐私与安全。</p>
                <span class="badge">AES-256</span>
            </div>
            <div class="card">
                <span class="icon">⚡</span>
                <h3>远程桌面</h3>
                <p>低延迟屏幕共享，支持键盘鼠标控制。</p>
                <span class="badge">60fps</span>
            </div>
            <div class="card">
                <span class="icon">📁</span>
                <h3>文件传输</h3>
                <p>拖拽式文件分享，支持大文件断点续传。</p>
                <span class="badge">P2P 加速</span>
            </div>
            <div class="card">
                <span class="icon">💬</span>
                <h3>即时消息</h3>
                <p>内置聊天工具，团队协作更高效。</p>
                <span class="badge">消息已读</span>
            </div>
            <div class="card">
                <span class="icon">📊</span>
                <h3>网络监控</h3>
                <p>实时流量统计与连接状态总览。</p>
                <span class="badge">带宽监测</span>
            </div>
        </div>

        <!-- 底部 -->
        <footer class="footer">
            <span>© 2026 远程控制平台 · 开源项目</span>
            <span>
                <a href="#">帮助</a> · 
                <a href="#">隐私</a> · 
                <a href="#">GitHub</a>
            </span>
        </footer>
    </div>

    <script>
        // ===== 主题切换逻辑 =====
        const toggleBtn = document.getElementById('themeToggle');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            toggleBtn.textContent = theme === 'dark' ? '🌙' : '☀️';
            
            // 调试日志
            console.log('主题已切换为:', theme);
        }

        toggleBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            setTheme(next);
        });

        // 初始化按钮图标
        (function initToggleIcon() {
            const current = document.documentElement.getAttribute('data-theme');
            toggleBtn.textContent = current === 'dark' ? '🌙' : '☀️';
            console.log('当前主题:', current);
        })();
    </script>
</body>
</html>
