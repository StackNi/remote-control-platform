<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fa;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 48px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 16px rgba(0, 0, 0, 0.04);
            text-align: center;
            transition: all 0.2s;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 24px;
            display: block;
        }
        .message {
            font-size: 24px;
            font-weight: 500;
            color: #1e293b;
            line-height: 1.5;
            letter-spacing: 0.3px;
        }
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
            }
            .message {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🛠️</span>
        <div class="message">安卓版正在维护中，敬请期待</div>
    </div>
</body>
</html>
